<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 13.5px;
        fill: #cdd6f4;
      }

      .p { fill: #8AB4F8; }
      .cmd { fill: #a6e3a1; }
      .fn { fill: #f9e2af; }
      
      .name { fill: #f9e2af; font-weight: 600; }
      .ar { fill: #585b70; }
      .gray { fill: #bac2de; }
      
      .lbl { fill: #6c7086; }
      .arr { fill: #585b70; }
      .val { fill: #cdd6f4; }
      
      .url { fill: #8AB4F8; text-decoration: underline; cursor: pointer; }
      .accent { fill: #eb6b5b; }
      .dim2 { fill: #585b70; }
      .tag { fill: #6c7086; }

      /* Language & Tool syntax highlighting colors */
      .c-py, .c-js, .c-tf, .c-hf, .c-sk, .c-lx, .c-aws, .c-cf { fill: #f9e2af; }
      .c-c, .c-cv, .c-ard, .c-nv, .c-nj { fill: #a6e3a1; }
      .c-cpp, .c-html, .c-pt, .c-ker, .c-git { fill: #eb6b5b; }
      .c-ts, .c-css, .c-dk, .c-re { fill: #8AB4F8; }
      
      .cursor { fill: #8AB4F8; animation: blink 1.1s step-start infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.9; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="800" height="610" rx="8" fill="#282524" />
  
